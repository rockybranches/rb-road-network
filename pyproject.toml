[project]
name = "rb-road-network"
version = "0.2.0"
description = "Rocky Branches Road Network Toolkit — road-distance market area analysis and demographic reporting"
readme = "README.md"
requires-python = ">=3.12"
# The command-line client only talks to the Worker over HTTP.
dependencies = [
    "click>=8.3.1",
]

[project.optional-dependencies]
# tools/ingest: builds the SQL that is loaded into D1.
ingest = [
    "numpy>=2.4.0",
    "pyogrio>=0.12.1",
    "shapely>=2.1.2",
]
# The data download and conversion helpers under scripts/.
scripts = [
    "aria2p>=0.12.1",
    "gdal<3.12.1",
    "geopandas>=1.1.2",
    "geopy>=2.4.1",
    "ipython>=9.8.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pyproj>=3.7.2",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "scipy>=1.16.3",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
rb-road-network = "rb_road_network.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["rb_road_network"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
